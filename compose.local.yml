services:
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitoring-service:1.9.3
    init: true
    env_file:
      - .env.docker.local
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3001}:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/v1/dashboard/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
